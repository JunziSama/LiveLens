common:
  # ip 代理池
  proxy_pool:
    # 是否启用 true/false
    enable: false
    # ip池地址，参考 https://github.com/jhao104/proxy_pool
    proxy_pool_url: ""
  # 启动成功通知；旧版 common.push_channel.send_test_msg_when_start 仍兼容
  startup_notification:
    # 是否在项目启动时发送通知 true/false
    enable: false
    # 目标推送通道名称；留空表示发送到全部已启用通道
    target_push_name_list: []
    title: "【推送组件-启动成功】🎉"
    content: ""
    # 支持相对项目目录的本地路径、绝对路径及 http/https/file URL
    pic_url: "Jun.jpg"
    jump_url: ""
    content_before: "[角落里的菌]"
    content_after: |-
      哔哩哔哩主页：https://space.bilibili.com/591893685
      哔哩哔哩直播：http://live.bilibili.com/23075731

query_task:
  # 任务名称，可自定义
  - name: "bilibili_example"
    # 是否启用 true/false
    enable: false
    # 任务类型，bilibili/weibo/xhs/douyin
    type: bilibili
    # 查询间隔，单位秒，不建议设置太频繁
    intervals_second: 60
    # 查询开始时间，格式 HH:mm
    begin_time: "00:00"
    # 查询结束时间，格式 HH:mm
    end_time: "23:59"
    # 推送通道名称，对应 push_channel 中的 name
    target_push_name_list: []
    # 是否启用动态检测 true/false
    enable_dynamic_check: true
    # 是否启用直播检测 true/false
    enable_living_check: true
    # 用户 uid 列表，参考 https://space.bilibili.com/1795147802
    uid_list: []
    # 是否跳过提醒"转发"类型的动态 true/false
    skip_forward: true
    # 如果请求提示 -352, 可以填入下面两项之一, 建议使用 payload 自动获取buvid3
    # cookie，可选，配置后可以一定程度防ban，建议用小号的，貌似无痕窗口不登录时拿到的cookie也能用，优先级高于自动获取buvid3
    cookie: ""
    # 浏览器指纹，取自于 /x/internal/gaia-gateway/ExClimbWuzhi 接口的body，需要填入的是payload参数的value，用于自动获取并激活buvid3
    payload: ""
    # ========== @ 控制字段 ==========
    at_qq: ""
    at_qq_dynamic: ""
    at_qq_live: ""
    at_qq_live_end: ""
    # ========== 时长免打扰控制字段（单位：分钟） ==========
    mute_enable_dynamic: true       # 动态免打扰开关
    mute_minutes_dynamic: 30        # 动态免打扰时长（分钟）
    mute_enable_live: true          # 开播免打扰开关
    mute_minutes_live: 60           # 开播免打扰时长（分钟）
    mute_enable_live_end: false     # 下播免打扰开关
    mute_minutes_live_end: 60       # 下播免打扰时长（分钟）
    # ========== 时间段免打扰（格式：开始时间,结束时间;开始时间,结束时间） ==========
    # 支持整点（如 0,7）或精确到分钟（如 00:00,07:00），留空表示不启用
    mute_time_ranges_dynamic: "0,7;"    # 动态免打扰时间段（示例：0,7;12,14）
    mute_time_ranges_live: "0,7;"       # 开播免打扰时间段（示例：0-7点、12-14点）
    mute_time_ranges_live_end: ""       # 下播免打扰时间段
    # =============================================

  - name: "weibo_example"
    enable: false
    type: weibo
    intervals_second: 60
    begin_time: "00:00"
    end_time: "23:59"
    target_push_name_list: []
    enable_dynamic_check: true
    uid_list: []
    cookie: ""

  - name: "xhs_example"
    enable: false
    type: xhs
    intervals_second: 300
    begin_time: "00:00"
    end_time: "23:59"
    target_push_name_list: []
    enable_dynamic_check: true
    profile_id_list: []
    cookie: ""

  - name: "douyin_example"
    enable: false
    type: douyin
    intervals_second: 30
    begin_time: "00:00"
    end_time: "23:59"
    target_push_name_list: []
    enable_dynamic_check: false
    signature_server_url: ""
    username_list: []
    sec_uid_list: []
    enable_living_check: true
    douyin_id_list: []

  - name: "douyu_example"
    enable: false
    type: douyu
    intervals_second: 60
    begin_time: "00:00"
    end_time: "23:59"
    target_push_name_list: []
    enable_living_check: true
    room_id_list: []
    # ========== @ 控制字段（斗鱼） ==========
    at_qq: ""
    at_qq_live: ""
    at_qq_live_end: ""
    # ========== 时长免打扰控制字段（斗鱼，单位：分钟） ==========
    mute_enable_live: true          # 开播免打扰开关
    mute_minutes_live: 60           # 开播免打扰时长（分钟）
    mute_enable_live_end: false     # 下播免打扰开关
    mute_minutes_live_end: 60       # 下播免打扰时长（分钟）
    # ========== 时间段免打扰（斗鱼） ==========
    mute_time_ranges_live: "0,7;"  # 开播免打扰时间段
    mute_time_ranges_live_end: ""  # 下播免打扰时间段
    # =================================================

  - name: "huya_example"
    enable: false
    type: huya
    intervals_second: 300
    begin_time: "00:00"
    end_time: "23:59"
    target_push_name_list: []
    enable_living_check: true
    room_id_list: []

